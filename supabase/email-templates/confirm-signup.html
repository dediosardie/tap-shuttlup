<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0b0b0b;font-family:Segoe UI,Arial,sans-serif;color:#e5e5e5;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0b0b0b;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:560px;background:#121212;border:1px solid #2a2a2a;border-radius:18px;padding:28px;">
            <tr><td style="font-size:20px;font-weight:700;color:#f97316;">Shutt'L Up Tap</td></tr>
            <tr><td style="padding-top:10px;font-size:22px;font-weight:700;color:#ffffff;">Confirm your signup</td></tr>
            <tr><td style="padding-top:10px;font-size:14px;line-height:1.65;color:#b3b3b3;">Hi {{ .Email }}, welcome to Shutt'L Up Tap. Confirm your email to activate your profile and start sharing your NFC card.</td></tr>
            <tr>
              <td style="padding-top:22px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(130deg,#f97316 0%,#fb923c 100%);color:#ffffff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:12px;">Confirm Email</a>
              </td>
            </tr>
            <tr><td style="padding-top:16px;font-size:12px;color:#8a8a8a;">If you did not create an account, you can ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
